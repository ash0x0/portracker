name: Validate Portracker (fork, no publishing)

# Each architecture builds and tests natively; no QEMU or registry publishing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            image: portracker:ci
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: portracker:ci-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Lint and unit tests
        run: |
          npm run lint
          npm test -- --runInBand
          npm run test:release
          npm run test:frontend

      - name: Install Playwright Chromium for browser contracts
        run: npx playwright install --with-deps chromium

      - name: Verify Docker build context
        run: npm run test:context

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build native Docker test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run native Docker image contracts
        shell: bash
        env:
          TEST_IMAGE: ${{ matrix.image }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          export CONTRACT_ARTIFACTS="test-results/$TARGET_ARCH"
          mkdir -p "$CONTRACT_ARTIFACTS"
          npm run test:image -- "$TEST_IMAGE" "linux/$TARGET_ARCH" 2>&1 | tee "$CONTRACT_ARTIFACTS/checks.log"

      - name: Retain regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-contracts-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
