name: Validate Portracker (fork, no publishing)

# This fork is for development and PR review. All Docker builds are local to CI.
# There are deliberately no tag, release, registry login, or image-push steps.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Lint and unit tests
        run: |
          npm run lint
          npm test -- --runInBand
          npm run test:release
          npm run test:frontend

      - name: Install Playwright Chromium for browser contracts
        run: npx playwright install --with-deps chromium

      - name: Verify Docker build context
        run: npm run test:context

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build AMD64 test image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: portracker:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ARM64 test image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: portracker:ci-arm64
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Docker image contracts on both architectures
        shell: bash
        run: |
          set -euo pipefail
          for architecture in amd64 arm64; do
            if [ "$architecture" = arm64 ]; then
              test_image="portracker:ci-arm64"
            else
              test_image="portracker:ci"
            fi
            export CONTRACT_ARTIFACTS="test-results/$architecture"
            mkdir -p "$CONTRACT_ARTIFACTS"
            npm run test:image -- "$test_image" "linux/$architecture" 2>&1 | tee "$CONTRACT_ARTIFACTS/checks.log"
          done

      - name: Retain regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
