name: Registry PR temporary validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  registry-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Lint and test registry
        run: |
          npm run lint
          npm test -- --runInBand
          npm run test:frontend
          npm run test:release
